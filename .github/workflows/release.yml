name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  wheels:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28", smoke: true }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28", smoke: true }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: aarch64, smoke: true }
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x86_64, smoke: true }
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28", interpreters: "-i python3.14t -i python3.15t" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28", interpreters: "-i python3.14t -i python3.15t" }
          - { os: macos-latest, target: aarch64, freethreaded: true }
          - { os: macos-latest, target: x86_64, freethreaded: true }
          - { os: windows-latest, target: x86_64, freethreaded: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.freethreaded
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - if: matrix.freethreaded
        id: freethreaded
        shell: bash
        run: |
          uv python install 3.14t 3.15t
          older=$(uv python find 3.14t)
          newer=$(uv python find 3.15t)
          echo "interpreters=-i ${older//\\//} -i ${newer//\\//}" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --profile dist --locked --out dist ${{ matrix.interpreters }} ${{ steps.freethreaded.outputs.interpreters }}
      - if: matrix.smoke
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - if: matrix.smoke
        shell: bash
        run: uv run --isolated --no-project --python 3.12 --with pytest --with aiohttp --with cryptography --with dist/*.whl pytest -p no:cacheprovider
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}${{ (matrix.interpreters || matrix.freethreaded) && '-freethreaded' || '' }}
          path: dist

  sdist:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bostie/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
