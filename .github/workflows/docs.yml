name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      # the API reference is read from the source, so the Rust core is not built
      - run: uv run --locked --only-group docs python docs/i18n/languages.py build
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      SITE: ${{ needs.deploy.outputs.page_url }}
      KEY: 9ddf805c253002aa73f4b345b0faa425
    steps:
      - run: |
          test "$(curl -sSf "${SITE}${KEY}.txt")" = "$KEY"
          for sitemap in $(curl -sSf "${SITE}robots.txt" | sed -n 's/^Sitemap: //p'); do
            curl -sSf "$sitemap" | grep -o '<loc>[^<]*' | cut -c6-
          done > urls.txt
          python3 -c 'import json, os, sys; site, key = os.environ["SITE"], os.environ["KEY"]; print(json.dumps({"host": site.removeprefix("https://").rstrip("/"), "key": key, "keyLocation": f"{site}{key}.txt", "urlList": sys.stdin.read().split()}))' < urls.txt > body.json
          curl -sSf -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @body.json
          echo "IndexNow took $(wc -l < urls.txt) URLs"
