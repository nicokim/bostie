[project]
site_name = "bostie"
site_url = "https://bostie.dev/"
repo_url = "https://github.com/nicokim/bostie"
repo_name = "nicokim/bostie"
site_description = "A Discord library for Python with a Rust core, built around reliable voice."
exclude_docs = """
snippets/
skills/
/plugin.json
/i18n/
/overrides/
"""
extra_css = ["assets/stylesheets/bostie.css"]
extra_javascript = ["assets/javascripts/languages.js"]
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    "install.md",
    "quickstart.md",
    "assistants.md",
  ] },
  { "Guides" = [
    { "Interactions" = [
      "guide/commands.md",
      "guide/context-menus.md",
      "guide/registration.md",
      "guide/responses.md",
      "guide/messages.md",
      "guide/components.md",
      "guide/modals.md",
      "guide/checks.md",
    ] },
    { "The bot" = [
      "guide/running.md",
      "guide/events.md",
      "guide/tasks.md",
      "guide/routers.md",
      "guide/cache.md",
      "guide/gateway.md",
      "guide/sharding.md",
    ] },
    { "Data and HTTP" = [
      "guide/models.md",
      "guide/rest.md",
      "guide/webhooks.md",
      "guide/http-interactions.md",
      "guide/oauth2.md",
      "guide/platform.md",
    ] },
    { "Tools" = [
      "guide/formatting.md",
      "guide/testing.md",
      "guide/troubleshooting.md",
    ] },
  ] },
  { "Voice" = [
    "voice/index.md",
    "voice/playback.md",
    "voice/sinks.md",
    "voice/receiving.md",
  ] },
  { "Reference" = [
    "reference/bot-options.md",
    "reference/event-list.md",
    { "API" = [
      "reference/api/bot.md",
      "reference/api/commands.md",
      "reference/api/contexts.md",
      "reference/api/ui.md",
      "reference/api/checks.md",
      "reference/api/events.md",
      "reference/api/errors.md",
      "reference/api/voice.md",
      "reference/api/rest.md",
      "reference/api/clients.md",
      "reference/api/gateway.md",
      { "Models" = [
        "reference/api/models-messages.md",
        "reference/api/models-guilds.md",
        "reference/api/models-users.md",
        "reference/api/models-apps.md",
      ] },
      "reference/api/enums.md",
      "reference/api/utilities.md",
      "reference/api/testing.md",
    ] },
  ] },
  { "Examples" = "examples.md" },
]

[project.theme]
custom_dir = "docs/overrides"
language = "en"
logo = "assets/brand/bostie-logo.svg"
favicon = "assets/brand/bostie-logo.svg"
font.text = "Figtree"
font.code = "JetBrains Mono"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.snippets.check_paths = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["python"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
# the extension is never imported: _native is read from its stub
allow_inspection = false
show_source = false
show_if_no_docstring = true
members_order = "source"
inherited_members = true
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
show_symbol_type_heading = true
show_symbol_type_toc = true
filters = ["!^_"]
heading_level = 2
show_root_heading = true

[project.plugins.llmstxt]
markdown_description = "bostie is a Discord library for Python 3.12+ with a Rust core: slash commands, components, events, REST, HTTP interactions, OAuth2, and voice with DAVE end-to-end encryption. Install it with `pip install bostie`; `bostie.testing` runs bots against a fake Discord."
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Get started" = ["index.md", "install.md", "quickstart.md", "assistants.md"]
Guides = ["guide/*.md"]
Voice = ["voice/*.md"]
Reference = ["reference/*.md", "reference/api/*.md"]
Examples = ["examples.md"]

[project.plugins.macros]
render_by_default = false
include_dir = "docs/snippets/assistants"

[project.extra]
card_alt = "bostie, a Discord library for Python with a Rust core, built around reliable voice: Bostie the Boston Terrier waves next to pip install bostie"

# one line per translation in docs/i18n/<code>/: <theme language code> = "<its name in that language>"
[project.extra.languages]
es = "Español"
pt-BR = "Português (Brasil)"
fr = "Français"
de = "Deutsch"
ja = "日本語"
zh = "简体中文"
ko = "한국어"
ru = "Русский"
