[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bostie-core = { path = "crates/bostie-core" }
bytes = "1.12.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
fastrand = "2.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
mimalloc = { version = "0.1.52", default-features = false, features = ["v2", "local_dynamic_tls"] }
parking_lot = "0.13.0"
percent-encoding = "2.3.2"
pyo3 = { version = "=0.30.1", features = ["abi3-py312"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
sonic-rs = "0.5.10"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-websockets = { version = "0.13.3", features = ["client", "fastrand", "aws_lc_rs", "rustls-platform-verifier"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
twilight-http-ratelimiting = "=0.17.1"
zstd-safe = { version = "8.2.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
panic = "unwind"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
