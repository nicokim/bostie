[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "bostie"
description = "Discord library for Python with a Rust core, built around reliable voice"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.12"
dependencies = ["msgspec>=0.22.0"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "aiohttp>=3.14.5",
    "cryptography>=50.0.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.maturin]
python-source = "python"
module-name = "bostie._native"
manifest-path = "crates/bostie-native/Cargo.toml"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.ruff]
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"benches/harness/bot_runner.py" = ["E402"]
"python/bostie/voice/connection.py" = ["ASYNC109"]

[tool.mypy]
strict = true
files = ["python/bostie", "tests", "benches"]

[[tool.mypy.overrides]]
module = [
    "compression.*",
    "discord.*",
    "interactions.*",
    "orjson",
    "pyperf",
    "uvloop",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bot_runner"
disallow_untyped_defs = false

[tool.pytest]
testpaths = ["tests"]
faulthandler_timeout = "60"
filterwarnings = ["error"]
