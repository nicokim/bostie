[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "lyrecord"
description = "Discord library for Python with a Rust core, built around reliable voice"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.12"
dependencies = ["msgspec>=0.22.0"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "aiohttp>=3.14.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.maturin]
python-source = "python"
module-name = "lyrecord._native"
manifest-path = "crates/lyrecord-native/Cargo.toml"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.ruff]
src = ["python"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
strict = true
files = ["python/lyrecord", "tests", "benches"]

[[tool.mypy.overrides]]
module = "pyperf"
ignore_missing_imports = true

[tool.pytest]
testpaths = ["tests"]
faulthandler_timeout = "60"
filterwarnings = ["error"]
