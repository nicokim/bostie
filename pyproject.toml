[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "bostie"
description = "Discord library for Python with a Rust core, built around reliable voice"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.12"
dependencies = ["msgspec>=0.22.0"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://nicokim.github.io/bostie/"
Documentation = "https://nicokim.github.io/bostie/"
Repository = "https://github.com/nicokim/bostie"
Issues = "https://github.com/nicokim/bostie/issues"
Changelog = "https://github.com/nicokim/bostie/releases"

[project.optional-dependencies]
testing = ["aiohttp>=3.14.5", "cryptography>=50.0.2"]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "bostie[testing]",
    "deptry>=0.25.1",
    "mypy>=2.4.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "typos>=1.51.1",
    "zizmor>=1.31.1",
]
docs = ["mkdocstrings-python>=2.0.11", "zensical>=0.1.1"]

[tool.maturin]
python-source = "python"
module-name = "bostie._native"
manifest-path = "crates/bostie-native/Cargo.toml"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.ruff]
src = ["python"]

[tool.ruff.format]
exclude = ["docs/**/*.md"]  # their code blocks only include files from docs/snippets

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",     # mypy strict already requires every annotation
    "COM812",  # conflicts with ruff format
    "CPY",     # the licence lives in LICENSE-MIT and LICENSE-APACHE
    "D1",      # a docstring only where the name and signature are not enough
    "D401",    # factory docstrings are noun phrases ("A button that ...")
    "EM",      # assigning every message to a variable first adds a line per raise
    "FBT003",  # FBT001 already makes our flags keyword-only; the rest are stdlib calls like setblocking(False)
    "INP001",  # tests/ is a pytest rootdir, not a package
    "ISC001",  # conflicts with ruff format
    "N818",    # exception names follow the Discord library convention (HTTPException, Forbidden)
    "PLC0415", # imports inside functions are fine; python/bostie/voice/ruff.toml bans them for the voice layers
    "PLR0913", # every knob is a keyword argument by design; PLR0917 still caps positionals
    "S105",    # "token" is a Discord domain word, not a secret
    "TRY003",  # messages are built at the raise site
]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["format", "id", "type"]

[tool.ruff.lint.flake8-self]
extend-ignore-names = [  # the internal seams one bostie module reaches in another
    "_HIDDEN",
    "_after_hooks",
    "_apply",
    "_arguments",
    "_autocompletes",
    "_before_hooks",
    "_bind",
    "_bot",
    "_checks",
    "_decode",
    "_defaults",
    "_deliver",
    "_error_handler",
    "_filled",
    "_handle",
    "_link",
    "_match_command",
    "_member",
    "_option_payload",
    "_parent",
    "_payload",
    "_received",
    "_run",
    "_set_current_user",
    "_state",
    "_store_dm",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"python/bostie/{bot,voice/connection}.py" = ["ASYNC109"]  # timeout= is a setting with its own default (per member chunk, per voice join), not a bound on the whole call
"python/bostie/{_bridge,_dispatch,bot,tasks}.py" = ["BLE001"]  # they contain errors from user callbacks and the core
"python/bostie/voice/{player,recorder}.py" = ["BLE001"]  # a failing source or file ends its track or recording, not the player
"python/bostie/models/**" = ["RUF012"]  # msgspec copies an empty mutable default for each instance
"crates/**/vectors.py" = ["T201"]  # the script prints the vectors
"examples/**" = ["ARG"]  # listeners and hooks take their event, context or error even when unused
"docs/**" = ["ARG", "FBT001", "FBT002", "PLR0917", "S101"]  # command options are parameters; tests assert
"docs/i18n/languages.py" = ["S603"]  # it runs zensical with arguments it builds itself
"tests/**" = ["ARG", "FBT", "PLR0917", "PLR2004", "S101", "S106", "S107", "S603", "SLF001"]
"tests/{test_context,test_mutations}.py" = ["BLE001"]  # they hand back whatever the code under test raises
"tests/{test_voice_recording,test_voice_receive}.py" = ["PERF401"]  # a concurrent check watches the list grow item by item

[tool.mypy]
strict = true
files = ["docs", "examples", "python/bostie", "tests"]
warn_unreachable = true
strict_equality_for_none = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[tool.deptry.per_rule_ignores]
DEP001 = ["compression"]  # the standard library's zstd module from Python 3.14

[[tool.mypy.overrides]]
module = ["compression.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["python/bostie"]
typeCheckingMode = "strict"
reportPrivateUsage = false  # ruff SLF001 checks private access, with its list of internal seams
reportUninitializedInstanceVariable = true
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest]
strict = true
testpaths = ["tests"]
faulthandler_timeout = "60"
filterwarnings = ["error"]
